# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
        required: false
      seed:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    profiles: ["migrate", "seed"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    command: ["yarn", "prisma:migrate"]
    restart: "no"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    command: ["yarn", "prisma:seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-null@example.com}
    volumes:
      - ./apps/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
volumes:
  redis_data:
  caddy_data:
  caddy_config:
